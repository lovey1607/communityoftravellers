<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Error Diagnostic Catcher -->
    <script>
    (function() {
        const showError = (title, message, details) => {
            const div = document.createElement('div');
            div.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#0d1117;color:#f85149;padding:40px;font-family:monospace;z-index:999999;overflow:auto;box-sizing:border-box;';
            div.innerHTML = `
                <h1 style="color:#f85149;font-size:24px;margin-top:0;border-bottom:1px solid rgba(248,81,73,0.2);padding-bottom:15px;">🚨 Platform Error Detected</h1>
                <p style="font-size:16px;"><strong>${title}:</strong> ${message}</p>
                ${details ? `<pre style="background:rgba(255,255,255,0.05);padding:20px;border-radius:8px;white-space:pre-wrap;color:#c9d1d9;">${details}</pre>` : ''}
                <button onclick="location.reload(true)" style="background:#58a6ff;color:#ffffff;border:none;padding:10px 20px;border-radius:6px;font-weight:bold;margin-top:20px;cursor:pointer;font-family:sans-serif;">Force Refresh Cache</button>
            `;
            document.body ? document.body.appendChild(div) : document.documentElement.appendChild(div);
        };
        window.onerror = function(msg, url, line, col, err) {
            showError('Runtime Error', msg, `Source: ${url}\\nLine: ${line} | Col: ${col}\\n\\nStack Trace:\\n${err ? err.stack : 'N/A'}`);
            return false;
        };
        window.onunhandledrejection = function(e) {
            showError('Unhandled Promise Rejection', e.reason, `Stack Trace:\\n${e.reason && e.reason.stack ? e.reason.stack : 'N/A'}`);
        };
        window.addEventListener('error', function(e) {
            if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
                showError('Asset Loading Failed', `Could not load: ${e.target.src || e.target.href}`, 'This usually happens if the server returned a 404 or had a network interruption.');
            }
        }, true);
    })();
    </script>
